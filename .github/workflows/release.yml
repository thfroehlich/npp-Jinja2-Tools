name: Release Build
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version without v prefix"
        required: true
        type: string
      publish_release:
        description: "Publish GitHub Release"
        required: true
        default: false
        type: boolean
permissions:
  contents: write
env:
  BUILD_DIR: build/github-release
  PACKAGE_DIR: dist/Jinja2Tools
jobs:
  release:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Determine version
        id: version
        shell: pwsh
        run: |
          $version = if ("${{ github.event_name }}" -eq "push") { "${{ github.ref_name }}" -replace '^v','' } else { "${{ inputs.version }}" -replace '^v','' }
          if ($version -notmatch '^\d+\.\d+\.\d+([-.][0-9A-Za-z.-]+)?$') { throw "Invalid version: $version" }
          "version=$version" >> $env:GITHUB_OUTPUT
          "zip=Jinja2Tools-$version-win64.zip" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            helper/requirements.txt
            helper/requirements-dev.txt
      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: vcpkg.json
      - name: Build and test helper
        shell: pwsh
        run: |
          & "${{ github.workspace }}\helper\build-helper.ps1"
          if (-not (Test-Path "helper\dist\Jinja2Tools.Helper.exe")) { throw "Helper EXE missing" }
      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -S . -B "${{ env.BUILD_DIR }}" -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake" `
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}\dist" `
            -DJINJA2TOOLS_BUILD_TESTS=ON -DJINJA2TOOLS_BUILD_HELPER=OFF -DJINJA2TOOLS_PACKAGE_HELPER=ON
      - name: Build release
        run: cmake --build "${{ env.BUILD_DIR }}" --config Release --parallel
      - name: Run native tests
        run: ctest --test-dir "${{ env.BUILD_DIR }}" --build-config Release --output-on-failure
      - name: Install release
        run: cmake --install "${{ env.BUILD_DIR }}" --config Release
      - name: Validate files and create package
        shell: pwsh
        run: |
          $package = "${{ env.PACKAGE_DIR }}"
          $required = @("Jinja2Tools.dll","Jinja2Tools.Helper.exe","README.md","LICENSE","THIRD_PARTY_NOTICES.md")
          foreach ($name in $required) { if (-not (Test-Path "$package\$name")) { throw "Missing: $package\$name" } }
          $zip = "dist\${{ steps.version.outputs.zip }}"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path $package -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  ${{ steps.version.outputs.zip }}" | Set-Content "$zip.sha256" -Encoding ascii
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jinja2Tools-${{ steps.version.outputs.version }}-win64
          path: |
            dist/${{ steps.version.outputs.zip }}
            dist/${{ steps.version.outputs.zip }}.sha256
          if-no-files-found: error
      - name: Publish GitHub Release
        if: github.event_name == 'push' || inputs.publish_release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = if ("${{ github.event_name }}" -eq "push") { "${{ github.ref_name }}" } else { "v${{ steps.version.outputs.version }}" }
          if ("${{ github.event_name }}" -eq "workflow_dispatch") { git tag $tag; git push origin $tag }
          gh release create $tag "dist/${{ steps.version.outputs.zip }}" "dist/${{ steps.version.outputs.zip }}.sha256" --title "Jinja2 Tools $tag" --generate-notes --verify-tag
